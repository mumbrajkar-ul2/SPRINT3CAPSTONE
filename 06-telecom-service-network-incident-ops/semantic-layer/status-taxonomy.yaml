collisions:
- id: collision.gold_bronze_as_severity
  name: gold and bronze used as incident severity
  description: >-
    The words gold, silver, and bronze are service-class words. In this data they also fill the severity column of incidents and alarms, next to critical, high, medium, and low. A count grouped by severity places gold next to critical. Incidents: gold 41, bronze 50. Alarms: gold 48, bronze 52. INC-00002 on incidents.csv line 3 has severity gold. The repo states no allowed severity list.
  words:
  - status.word.gold
  - status.word.bronze
  - status.word.silver
  fields:
  - status.incident.severity
  - status.alarm.severity
  - status.circuit.service_class
  - status.circuit.sla_tier
  defect_refs:
  - F09
  resolution: >-
    Open. The severity list and its order are not set. Owner: Team-Force. This file records the words. It does not pick a cutoff.
  source:
  - data/synthetic/incidents.csv
  - data/synthetic/alarms.csv
  - docs/02-baseline/data-quality-baseline.md
  - docs/02-baseline/defect-list.md
- id: collision.status_words_in_hostname_and_vendor
  name: status words inside hostname and vendor
  description: >-
    The first device row REC-0001 has hostname legacy and vendor requires_review. Those are status words, not a host name or a supplier name. The same 14-word pool fills 16 columns across the six files: hostname, vendor, device_type, firmware, owner_team, credential_profile, interface, alarm_type, maintenance_window, root_cause, service_type, use_case, model, recommendation_risk, approval_required, and guardrail_status. A report grouped by vendor groups status words. The API matches a record id against every cell, so a request for the id legacy would return a device row whose hostname is legacy.
  words:
  - status.word.legacy
  - status.word.requires_review
  fields:
  - status.device.hostname
  - status.device.vendor
  - status.device.device_type
  - status.device.firmware
  - status.device.owner_team
  - status.device.credential_profile
  - status.alarm.interface
  - status.alarm.alarm_type
  - status.alarm.maintenance_window
  - status.incident.root_cause
  - status.service_order.service_type
  - status.ai_invocation.use_case
  - status.ai_invocation.model
  - status.ai_invocation.recommendation_risk
  - status.ai_invocation.approval_required
  - status.ai_invocation.guardrail_status
  defect_refs:
  - F17
  - F22
  resolution: >-
    Open. Which words are legal in hostname and vendor is Unknown. Rule rule.record_lookup_matches_key_only stops the id-in-any-cell match.
  source:
  - data/synthetic/devices.csv
  - docs/01-discovery/data-and-integration-map.md
  - docs/02-baseline/data-quality-baseline.md
  - docs/02-baseline/defect-list.md
  - apps/api/services/domain_service.py
- id: collision.rec_0001_first_key_in_six_tables
  name: REC-0001 is the first key in six tables
  description: >-
    The first data row of devices.csv, circuits.csv, alarms.csv, incidents.csv, service_orders.csv, and ai_invocations.csv all use REC-0001 as the key. The other keys in each file use a different prefix: DEV-, CIR-, ALA-, INC-, ORD-, and AI_-. A join on REC-0001 joins six different objects. The API reads only devices.csv, so GET /records/REC-0001 returns the device row. The prefix REC- matches no entity prefix.
  fields:
  - field.device.device_id
  - field.circuit.circuit_id
  - field.alarm.alarm_id
  - field.incident.incident_id
  - field.service_order.order_id
  - field.ai_invocation.ai_call_id
  defect_refs:
  - F21
  resolution: >-
    Open. Whether the shared text is a seed accident is Unknown. The id form for each entity is recorded on the key field in entities.yaml.
  source:
  - docs/01-discovery/data-and-integration-map.md
  - docs/02-baseline/defect-list.md
  - docs/01-discovery/brownfield-risk-register.md
- id: collision.clinician_role_in_telecom_api
  name: clinician is an API role in a telecom system
  description: >-
    apps/api/main.py accepts X-User-Role clinician on GET /records/{record_id}. A clinician is a health-care job. The telecom persona list in docs/domain-specific-spec.md does not contain it. A caller with that role can read a device row, including mgmt_ip and credential_profile. Why the word is on the list is Unknown.
  roles:
  - role.clinician
  defect_refs:
  - F03
  resolution: >-
    access-semantics.yaml lists role.clinician under removed_roles. Stage S04-03 removes it from the allow list.
  source:
  - apps/api/main.py
  - docs/domain-specific-spec.md
  - docs/02-baseline/defect-list.md
  - docs/01-discovery/brownfield-risk-register.md

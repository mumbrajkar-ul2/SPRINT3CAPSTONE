# status-taxonomy.yaml -- semantic layer 1.0.0
# Every status word in code, docs, and data, by column, with observed row counts.
# Counts come from one read-only pass over data/synthetic on 2026-10-10.
# This file sets no allowed list and no severity cutoff. The repo defines none.
version: 1.0.0
file: status-taxonomy
description: >-
  Every status word used in code, docs, and the CSV files, with the column it sits in and how many rows hold it. Counts are from one read of data/synthetic on 2026-10-10. The repo defines no allowed list for any column. Each field below says so with allowed_list_defined_by_repo false.
source:
- data/synthetic/devices.csv
- data/synthetic/circuits.csv
- data/synthetic/alarms.csv
- data/synthetic/incidents.csv
- data/synthetic/service_orders.csv
- data/synthetic/ai_invocations.csv
- data/synthetic/events.jsonl
- apps/api/main.py
- apps/api/services/ai_gateway.py
- docs/02-baseline/data-quality-baseline.md
- docs/01-discovery/data-and-integration-map.md
- docs/02-baseline/defect-list.md
words:
- id: status.word.ai_assisted
  word: ai_assisted
  description: >-
    A status word. It says a model took part. It also fills columns such as hostname and firmware where it has no clear meaning. The repo does not define it.
  appears_in:
  - status.device.hostname
  - status.device.vendor
  - status.device.device_type
  - status.device.firmware
  - status.device.owner_team
  - status.device.credential_profile
